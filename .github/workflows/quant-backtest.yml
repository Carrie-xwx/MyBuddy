name: Quant Backtest (A股+美股)

on:
  schedule:
    # 每周一 09:30 北京时间 = 01:30 UTC 跑一次回测
    - cron: '30 1 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'quant/**'
      - '.github/workflows/quant-backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install akshare pandas numpy matplotlib
          # 安装中文字体（让净值曲线图的中文标题正常显示）
          sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei || true

      - name: Run US backtest (先跑，结果会被 A股覆盖)
        run: python quant/run_quant.py --market US --top-n 10 --start 20210101 || echo "US market fetch failed (network), skip"

      - name: Run A-share backtest - 沪深300 实验版 (宽股票池，验证用)
        run: python quant/run_quant.py --market A --top-n 15 --universe hs300 --start 20210101 --out quant_output_hs300.json || echo "hs300 backtest failed (network), skip"

      - name: Run A-share backtest - 生产版 (32样本龙头，正alpha，最后写保证部署版为A股)
        run: python quant/run_quant.py --market A --top-n 10 --universe sample --start 20210101 --out quant_output.json

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quant/output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update quant backtest $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "Backtest results pushed"
          fi
