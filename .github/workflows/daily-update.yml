name: Daily Market Data Update

on:
  schedule:
    # 08:30 Beijing time = 00:30 UTC
    - cron: '30 0 * * *'
    # 12:30 Beijing time = 04:30 UTC (lunch update)
    - cron: '30 4 * * *'
    # 16:30 Beijing time = 08:30 UTC (afternoon update)
    - cron: '30 8 * * *'
    # 20:30 Beijing time = 12:30 UTC (evening update)
    - cron: '30 12 * * *'
  workflow_dispatch: # Manual trigger from GitHub Actions tab
  push:
    branches: [ main ]
    paths:
      - 'scripts/fetch_data.py'
      - '.github/workflows/daily-update.yml'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update market data
        run: python scripts/fetch_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update market data $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "Changes pushed successfully"
          fi
